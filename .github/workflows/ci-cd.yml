name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  lint:
    name: Lint (black + flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black==24.10.0 flake8==7.1.1

      - name: Run black (check only)
        run: black --check --diff .

      - name: Run flake8
        run: flake8 . --max-line-length=120 --extend-ignore=E203,W503 --exclude=.git,__pycache__,.venv

  test:
    name: Async unit tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    container:
      image: python:3.12-slim
    env:
      AZURE_OPENAI_ENDPOINT: "https://ci-test-openai.openai.azure.com/"
      AZURE_OPENAI_API_KEY: "ci-test-openai-key"
      AZURE_OPENAI_CHAT_DEPLOYMENT: "ci-test-chat-deployment"
      AZURE_SEARCH_ENDPOINT: "https://ci-test-search.search.windows.net"
      AZURE_SEARCH_API_KEY: "ci-test-search-key"
      AZURE_SEARCH_INDEX_NAME: "ci-test-index"
      DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test_db"
      MLFLOW_TRACKING_URI: "file:///tmp/mlruns"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential gcc libpq-dev
          rm -rf /var/lib/apt/lists/*

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (async unit tests)
        run: |
          pytest test_rag.py -v --maxfail=1 --disable-warnings --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          retention-days: 14

  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
